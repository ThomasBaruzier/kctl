[project]
name = "kctl"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "defusedxml",
  "lz4>=4.4.5",
  "markdownify>=1.2.3",
  "markitdown[docx,pptx,xlsx]>=0.1.9",
  "pillow>=13.0.0",
  "pypdfium2>=5.14.0",
  "python-dotenv",
  "tessdata-fast-eng>=1.0.0",
  "tesserocr>=2.12.0",
  "zstandard>=0.25.0",
]

[project.scripts]
kctl = "kctl.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "python-docx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".*",
  "*.egg",
  "build",
  "dist",
  "CVS",
  "_darcs",
  "{arch}",
  "node_modules",
  "venv",
  "dump",
]
